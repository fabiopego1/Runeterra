<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forja de Campeões · Runeterra</title>
  <meta name="description" content="Crie seu campeão de Runeterra passo a passo, com explicações de cada mecânica ao passar o mouse.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=dev">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark" data-sigil="compass"></span>
      <span class="brand-text"><span class="brand-kicker" data-t>Runeterra · Tabletop Chronicle</span><span class="brand-title" data-t>Champion Forge</span></span>
    </div>
    <nav class="header-actions" aria-label="Ferramentas">
      <a class="hbtn key" href="lore.html" title="O mundo de Runeterra"><span data-ico="map"></span><span>Lore</span></a>
      <a class="hbtn key" href="regras.html" title="Resumo de regras (tecla ?)"><span data-ico="codex"></span><span>Regras</span><kbd>?</kbd></a>
      <span class="hsep" aria-hidden="true"></span>
      <button class="hbtn" data-act="export"><span data-ico="download"></span><span data-t>Export</span></button>
      <label class="hbtn" for="import-file"><span data-ico="upload"></span><span data-t>Import</span></label>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
      <button class="hbtn" data-act="print"><span data-ico="print"></span><span data-t>Print</span></button>
      <button class="hbtn danger" data-act="reset"><span data-ico="reset"></span><span data-t>Start over</span></button>
    </nav>
  </header>

  <div class="layout">
    <nav class="steps-nav" id="nav" aria-label="Passos da criação"></nav>
    <main class="stage" id="stage"></main>
    <aside class="sheet-side" id="side" aria-label="Resumo do campeão"></aside>
  </div>

  <footer class="foot">
    <span class="foot-rule" aria-hidden="true"></span>
    <p data-t-html="FOOTER">Projeto de fã não oficial. Runeterra e League of Legends são © Riot Games. Uso pessoal e não comercial.</p>
    <a class="foot-gm" href="gm.html"><span data-ico="lock"></span><span data-t>GM Screen</span></a>
  </footer>

  <div id="tip" role="tooltip"></div>

  <script src="js/i18n.js?v=dev"></script>
  <script src="js/icons.js?v=dev"></script>
  <script src="js/vendor/pdf-lib.min.js?v=dev"></script>
  <script src="js/sheet-pdf.js?v=dev"></script>
  <script src="js/data-rules.js?v=dev"></script>
  <script src="js/data-tables.js?v=dev"></script>
  <script src="js/data-lore.js?v=dev"></script>
  <script src="js/pt/load.js?v=dev"></script>
  <script src="js/app.js?v=dev"></script>
</body>
</html>
