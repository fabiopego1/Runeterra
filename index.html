<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forja de Campeões · Runeterra</title>
  <meta name="description" content="Crie seu campeão de Runeterra passo a passo, com explicações de cada mecânica ao passar o mouse.">
  <meta name="theme-color" content="#0c0d10">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Forja de Campeões">
  <meta property="og:title" content="Forja de Campeões · Runeterra">
  <meta property="og:description" content="Crie seu campeão de Runeterra passo a passo, conheça o mundo e leve as regras para a mesa.">
  <meta property="og:url" content="https://fabiopego1.github.io/Runeterra/">
  <meta property="og:image" content="https://fabiopego1.github.io/Runeterra/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="assets/fonts/BarlowSemiCondensed-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Marcellus-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=dev">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark" data-sigil="compass"></span>
      <span class="brand-text"><span class="brand-kicker" data-t>Runeterra · Tabletop Chronicle</span><span class="brand-title" data-t>Champion Forge</span></span>
    </div>
    <nav class="header-actions" aria-label="Ferramentas">
      <a class="hbtn key" title="A ficha do seu campeão em tela cheia" href="ficha.html"><span data-ico="file"></span><span>Ficha</span></a>
      <a class="hbtn key" href="lore.html" title="O mundo de Runeterra"><span data-ico="map"></span><span>Lore</span></a>
      <a class="hbtn key" href="regras.html" title="Resumo de regras (tecla ?)"><span data-ico="codex"></span><span>Regras</span><kbd>?</kbd></a>
      <span class="hsep" aria-hidden="true"></span>
      <div class="file-menu">
        <button class="hbtn" id="file-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="file-pop"><span data-ico="file"></span><span>Arquivo</span><span class="chev" data-ico="chevron"></span></button>
        <div class="file-pop" id="file-pop" role="menu" hidden>
          <button role="menuitem" data-act="export"><span data-ico="download"></span><span>Exportar campeão<small>Salva um arquivo .json de backup</small></span></button>
          <label role="menuitem" for="import-file" tabindex="0"><span data-ico="upload"></span><span>Importar campeão<small>Abre um arquivo .json salvo antes</small></span></label>
          <button role="menuitem" data-act="print"><span data-ico="print"></span><span>Imprimir ficha</span></button>
          <button role="menuitem" data-act="tourOn"><span data-ico="codex"></span><span>Reativar o guia<small>Mostra de novo as dicas de cada capítulo</small></span></button>
          <hr>
          <button role="menuitem" class="danger" data-act="reset"><span data-ico="reset"></span><span>Recomeçar do zero<small>Apaga o campeão atual deste navegador</small></span></button>
        </div>
      </div>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
    </nav>
  </header>

  <div class="layout">
    <nav class="steps-nav" id="nav" aria-label="Passos da criação"></nav>
    <main class="stage" id="stage"></main>
  </div>

  <footer class="foot">
    <span class="foot-rule" aria-hidden="true"></span>
    <p data-t-html="FOOTER">Projeto de fã não oficial. Runeterra e League of Legends são © Riot Games. Uso pessoal e não comercial.</p>
    <a class="foot-gm" href="gm.html"><span data-ico="lock"></span><span data-t>GM Screen</span></a>
  </footer>

  <div id="tip" role="tooltip"></div>

  <script src="js/i18n.js?v=dev"></script>
  <script src="js/icons.js?v=dev"></script>
  <script src="js/sheet-pdf.js?v=dev"></script>
  <script src="js/data-rules.js?v=dev"></script>
  <script src="js/data-tables.js?v=dev"></script>
  <script src="js/data-lore.js?v=dev"></script>
  <script src="js/pt/load.js?v=dev"></script>
  <script src="js/app.js?v=dev"></script>
</body>
</html>
