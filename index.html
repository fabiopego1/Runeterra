<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Runeterra Champion Forge</title>
  <meta name="description" content="Create a Runeterra champion using the Sentinel Comics RPG character creation rules — with hover explanations of every mechanic.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=dev">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark" data-sigil="compass"></span>
      <span class="brand-text"><span class="brand-kicker">Runeterra · Tabletop Chronicle</span><span class="brand-title">Champion Forge</span></span>
    </div>
    <nav class="header-actions" aria-label="Tools">
      <button class="hbtn key" data-act="lore" title="World lore"><span data-ico="map"></span>Lore</button>
      <button class="hbtn key" data-act="rules" title="Rules cheat sheet (press ?)"><span data-ico="codex"></span>Rules<kbd>?</kbd></button>
      <span class="hsep" aria-hidden="true"></span>
      <button class="hbtn" data-act="export"><span data-ico="download"></span>Export</button>
      <label class="hbtn" for="import-file"><span data-ico="upload"></span>Import</label>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
      <button class="hbtn" data-act="print"><span data-ico="print"></span>Print</button>
      <button class="hbtn danger" data-act="reset"><span data-ico="reset"></span>Start over</button>
    </nav>
  </header>

  <div class="layout">
    <nav class="steps-nav" id="nav" aria-label="Creation steps"></nav>
    <main class="stage" id="stage"></main>
    <aside class="sheet-side" id="side" aria-label="Champion summary"></aside>
  </div>

  <footer class="foot">
    <span class="foot-rule" aria-hidden="true"></span>
    <p>Unofficial fan project. Runeterra and League of Legends are © Riot Games. Rules adapted from
    <em>Sentinel Comics: The Roleplaying Game</em> © Greater Than Games — for personal, non-commercial use.</p>
  </footer>

  <div id="tip" role="tooltip"></div>

  <script src="js/icons.js?v=dev"></script>
  <script src="js/vendor/pdf-lib.min.js?v=dev"></script>
  <script src="js/data-rules.js?v=dev"></script>
  <script src="js/data-tables.js?v=dev"></script>
  <script src="js/data-lore.js?v=dev"></script>
  <script src="js/app.js?v=dev"></script>
  <script src="js/cheatsheet.js?v=dev"></script>
  <script src="js/lore.js?v=dev"></script>
</body>
</html>
