<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Escudo do Mestre · Forja de Campeões</title>
  <link rel="preload" href="assets/fonts/BarlowSemiCondensed-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Marcellus-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=dev">
</head>
<body class="gm-page">
  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-mark" data-sigil="compass"></span>
      <span class="brand-text"><span class="brand-kicker" data-t>Runeterra · Tabletop Chronicle</span><span class="brand-title" data-t>GM Screen</span></span>
    </a>
    <nav class="header-actions" aria-label="Ferramentas">
      <a class="hbtn" href="index.html"><span data-ico="prev"></span><span data-t>Champion Forge</span></a>
      <button class="hbtn" data-gm-lock hidden><span data-ico="lock"></span><span data-t>Lock</span></button>
    </nav>
  </header>

  <main class="gm-main">
    <form class="gm-gate" id="gm-gate" autocomplete="off">
      <span class="gm-seal" data-ico="lock" aria-hidden="true"></span>
      <div class="eyebrow" data-t>Game Master only</div>
      <h1 data-t>Behind the Screen</h1>
      <p class="muted" data-t>Enter the GM password to open this page.</p>
      <label class="gm-field"><span class="sr-only" data-t>Password</span>
        <input type="password" id="gm-pass" required autocomplete="current-password" data-t-placeholder="Password" placeholder="Password"></label>
      <button class="btn primary" type="submit"><span data-t>Unlock</span></button>
      <p class="gm-error" id="gm-error" role="alert" hidden></p>
    </form>

    <section class="gm-room" id="gm-room" hidden aria-live="polite">
      <div class="eyebrow" data-t>Game Master only</div>
      <h1 data-t>Behind the Screen</h1>
      <div class="gm-content" id="gm-content"></div>
      <div id="gm-flavour"></div>
    </section>
  </main>

  <div id="tip" role="tooltip"></div>

  <script src="js/i18n.js?v=dev"></script>
  <script src="js/icons.js?v=dev"></script>
  <script src="js/data-rules.js?v=dev"></script>
  <script src="js/data-tables.js?v=dev"></script>
  <script src="js/data-lore.js?v=dev"></script>
  <script src="js/pt/load.js?v=dev"></script>
  <script src="js/gm-flavour.js?v=dev"></script>
  <script src="js/gm-vault.js?v=dev"></script>
  <script src="js/gm.js?v=dev"></script>
</body>
</html>
